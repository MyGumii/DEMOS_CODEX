[pytest]
minversion = 9.0
testpaths = tests
pythonpath = ..
python_files = test_*.py
python_classes = Test* *Tests
python_functions = test_*
addopts =
    --strict-config
    --strict-markers
markers =
    unit: isolated unit tests without external services or shared process state
    integration: integration tests spanning application components or persistence
    acceptance: mandatory product acceptance scenarios from TEST_OPERATIONS.md
    browser: real or ephemeral browser interaction tests
    concurrency: multi-client or multi-process concurrency and fencing tests
    fault: deterministic failpoint, crash, restart, or recovery tests
    migration: legacy inventory, migration, idempotency, and reconciliation tests
    load: target-class performance, saturation, and scope-leak load tests
    operations: deployment preflight, backup, projection, and service operation tests
    restore: isolated backup restore-drill and recovery objective tests
    regression: compatibility coverage for existing personal, Notion, and chat behavior
    scenario(id): bind a test to a TEST_OPERATIONS.md scenario ID such as ORG-001

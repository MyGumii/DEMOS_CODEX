# code_assist_v1 runtime dependency lock
#
# Verified baseline: Windows x86-64, CPython 3.14.3, 2026-08-11.
# This is a complete exact-version freeze of the direct runtime dependencies
# imported by the current applications and their active transitive graph.  We
# freeze transitives as well as directs so a clean single-venv install cannot
# silently resolve a different Flask, HTTP, OAuth, or crypto stack.
#
# Distribution archive hashes are intentionally not fabricated from installed
# files.  Add --require-hashes only after an approved Windows/Python 3.14
# wheelhouse has been downloaded and its archives have been hashed.  Until that
# artifact step exists, these exact versions are the reproducible resolver lock.
#
# Python's stdlib sqlite3 is not supplied by pip.  Production, migration,
# worker, backup, restore, and load-test interpreters must independently pass:
#   sqlite_version()   == 3.53.4
#   sqlite_source_id() == 2026-07-24 19:02:57
#     bf7c7f30031888f4e796e429ab3978879485813aaca6f641c7b33e4e09459bcc
# The verified CPython 3.14.3 development environment embeds SQLite 3.50.4 and
# therefore remains development-only until the approved interpreter is supplied.
#
# Not locked here because they are optional deployment integrations:
# llama-cpp-python/CUDA (central inference), pywin32 (configured Office COM
# fallback), and PyMuPDF (best-effort scanned-PDF page rendering).  The P7.5
# production WSGI choice is Waitress below.  Core PDF text extraction uses
# pypdf below.

